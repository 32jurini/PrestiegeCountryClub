<!doctype html><html lang="en"><meta charset="utf-8"><title>Orchard Bend approach check</title>
<style>html,body,iframe{width:100%;height:100%;border:0;margin:0;display:block}output{position:fixed;bottom:0;left:0;background:#10231b;color:white;font:12px system-ui;padding:5px}</style>
<iframe title="Orchard Bend playtest" src="../"></iframe><output>Loading the course…</output>
<script type="module">
const frame=document.querySelector('iframe'), report=document.querySelector('output');
async function until(check){
 const deadline=performance.now()+120000;
 while(!check()){
  if(performance.now()>deadline)throw Error('Timed out waiting for the game');
  await new Promise(resolve=>setTimeout(resolve,100));
 }
}
try{
 await until(()=>frame.contentDocument?.querySelector('#loader.hidden')&&frame.contentDocument.querySelector('[data-page="courses"]'));
 const doc=frame.contentDocument,w=frame.contentWindow;
 doc.querySelector('[data-page="courses"]').click();
 doc.querySelector('[data-course="royal"]').click();
 await until(()=>doc.querySelector('#holeLabel').textContent.includes('ORCHARD BEND')&&doc.querySelector('#loader.hidden'));
 if(!doc.querySelector('#tutorialOverlay').classList.contains('hidden'))doc.querySelector('#coachSkip').click();
 function key(type,code){doc.body.dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true}))}
 key('keydown','ArrowRight');key('keydown','ArrowRight');key('keydown','Space');
 await until(()=>doc.querySelector('#powerLabel').textContent==='100%');
 key('keyup','Space');
 await until(()=>doc.querySelector('#banner').textContent.includes('YDS TOTAL'));
 report.textContent='Orchard Bend · '+doc.querySelector('#lieLabel').textContent+' · '+doc.querySelector('#distanceLabel').textContent;
}catch(e){report.textContent=e.message}
</script></html>
